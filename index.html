<!-- 맨 위 데모 띠 -->
<div class="band">
  <div class="band-in">
    <p class="band-t">제안용 데모 · 회사명과 데이터는 예시</p>
    <nav class="dnav" id="dnav" aria-label="데모 화면"></nav>
    <label class="dsel-w"><span class="sr">데모 화면 고르기</span>
      <select class="dsel" id="dsel">
        <option value="#pick">선생님 화면</option>
        <option value="#send">보내기</option>
        <option value="#admin">관리 화면</option>
        <option value="#api">API 미리보기</option>
      </select>
    </label>
  </div>
</div>

<div id="view-pick" class="view"></div>
<div id="view-send" class="view" hidden></div>
<div id="view-admin" class="view" hidden></div>
